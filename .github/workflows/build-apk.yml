name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bundle the web page
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node build-web.mjs
      # The ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches platform 35 if missing.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CALYPSO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/calypso-release.jks"
            echo "CALYPSO_KEYSTORE_FILE=$RUNNER_TEMP/calypso-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No CALYPSO_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway debug key and can't update a previously installed copy."
          fi
      - name: Build APK
        env:
          CALYPSO_KEYSTORE_PASSWORD: ${{ secrets.CALYPSO_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CalypsoAsset-apk
          path: app/build/outputs/apk/release/*.apk
